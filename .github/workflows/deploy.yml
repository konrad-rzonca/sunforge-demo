# Deploys a release's web.zip to GitHub Pages, at demo.sunforgetools.com.
# It runs by hand on main, because the github-pages environment deploys only from the default
# branch: a run on a release event has the tag as its ref and is refused.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release whose web.zip to deploy
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern web.zip
          mkdir site
          unzip -q web.zip -d site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
